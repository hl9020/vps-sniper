<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VPS-Sniper</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <h1>VPS-Sniper</h1>
    <span id="pill" class="pill">loading</span>
    <span id="meta" class="muted small"></span>
  </header>

  <main>
    <section class="card">
      <div class="head">
        <h2>Jobs</h2>
        <span class="muted small">One job = one server type in one location. An order job orders exactly one server, then stops.</span>
      </div>
      <div class="row add">
        <select id="newType"></select>
        <select id="newLoc"></select>
        <div class="seg">
          <label><input type="radio" name="newAction" value="notify" checked><span>Notify</span></label>
          <label><input type="radio" name="newAction" value="order"><span>Notify + order</span></label>
        </div>
        <button type="button" id="add">Add job</button>
      </div>
      <table id="jobs"></table>
      <p id="noJobs" class="muted small">No jobs yet.</p>
    </section>

    <section class="card">
      <div class="head">
        <h2>Settings</h2>
        <label class="switch"><input type="checkbox" id="enabled"><span>Watching enabled</span></label>
      </div>
      <div class="row">
        <label>Check every <input type="number" id="intervalSec" min="1" max="3600"> s</label>
        <span id="intervalHint" class="muted small"></span>
      </div>
      <h3>Order settings <span class="muted small">used by all order jobs</span></h3>
      <div class="row">
        <label>Image <select id="image"></select></label>
        <label>Name prefix <input type="text" id="namePrefix" maxlength="31"></label>
        <label class="check"><input type="checkbox" id="ipv4"> Public IPv4</label>
      </div>
      <div class="row base">
        <span class="label">SSH keys</span>
        <div id="sshKeys" class="chips"></div>
      </div>
    </section>

    <div class="bar">
      <span id="msg" class="small"></span>
      <button type="button" id="testMail" title="Sends a mail to SMTP_TO">Send test mail</button>
      <button type="button" id="save" class="primary">Save</button>
    </div>

    <section class="card">
      <h2>Activity</h2>
      <ul id="events" class="list"></ul>
    </section>
  </main>
</body>
</html>
